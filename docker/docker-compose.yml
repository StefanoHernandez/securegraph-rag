# SecurGraph RAG — local dev stack.
# Minimal-hardware mode (<16 GB RAM): aggressive resource limits applied.
# Ollama runs NATIVE on host by default. Container variant: `--profile ollama-container`.

name: securgraph

services:

  # ===========================================================================
  # PostgreSQL — metadata, provenance, audit
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: securgraph-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-securgraph}
      POSTGRES_DB: ${POSTGRES_DB:-securgraph}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securgraph} -d ${POSTGRES_DB:-securgraph}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ===========================================================================
  # Qdrant — vector store
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: securgraph-qdrant
    ports:
      - "6333:6333"   # HTTP / dashboard
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__GRPC_PORT: 6334
    healthcheck:
      # Qdrant returns plain text "qdrant-version" on /; use root liveness probe.
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6333/readyz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # ===========================================================================
  # Neo4j — graph store (community edition; GDS plugin)
  # Heap + page cache tuned for minimal hardware.
  # ===========================================================================
  neo4j:
    image: neo4j:5.25-community
    container_name: securgraph-neo4j
    environment:
      NEO4J_AUTH: ${SECURGRAPH_NEO4J_USER:-neo4j}/${SECURGRAPH_NEO4J_PASSWORD:-securgraph-neo4j}
      NEO4J_PLUGINS: '["graph-data-science","apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: gds.*,apoc.*
      NEO4J_dbms_security_procedures_allowlist: gds.*,apoc.*
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_db_tx__log_rotation_retention__policy: "100M size"
    ports:
      - "7474:7474"   # HTTP / browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1500M
    restart: unless-stopped

  # ===========================================================================
  # OpenFGA — authorization (ReBAC)
  # Migrate-then-run pattern: migrate runs once and exits.
  # ===========================================================================
  openfga-migrate:
    image: openfga/openfga:v1.8.0
    container_name: securgraph-openfga-migrate
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-securgraph}:${POSTGRES_PASSWORD:-securgraph}@postgres:5432/${POSTGRES_DB:-securgraph}?sslmode=disable&search_path=openfga
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  openfga:
    image: openfga/openfga:v1.8.0
    container_name: securgraph-openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-securgraph}:${POSTGRES_PASSWORD:-securgraph}@postgres:5432/${POSTGRES_DB:-securgraph}?sslmode=disable&search_path=openfga
      OPENFGA_PLAYGROUND_ENABLED: "true"
      OPENFGA_LOG_LEVEL: info
    ports:
      - "8080:8080"   # HTTP API
      - "8081:8081"   # gRPC
      - "3000:3000"   # Playground UI
    depends_on:
      postgres:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "grpc_health_probe -addr=openfga:8081 || (wget --no-verbose --tries=1 --spider http://localhost:8080/healthz || exit 1)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ===========================================================================
  # Jaeger (all-in-one) — OTel traces UI
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.62
    container_name: securgraph-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:16686 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ===========================================================================
  # Redis — added in M6 for Arq workers, decision cache, LangGraph checkpointer.
  # Profile-gated: enable with `--profile workers`.
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: securgraph-redis
    profiles: ["workers"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # ===========================================================================
  # Ollama (container variant) — disabled by default on macOS.
  # Enable with `--profile ollama-container` to run inside Docker (no GPU).
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: securgraph-ollama
    profiles: ["ollama-container"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  redis_data:
  ollama_data:

networks:
  default:
    name: securgraph

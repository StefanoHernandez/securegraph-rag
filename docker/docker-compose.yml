# SecurGraph RAG — local dev stack.
# Minimal-hardware mode (<16 GB RAM): aggressive resource limits applied.
# Ollama is a legacy optional profile only; it is never part of the default or acceptance stack.
#
# Security posture
# ----------------
# Every port binds to ${SECURGRAPH_BIND_ADDR:-127.0.0.1} — loopback only. These
# services hold the data that OpenFGA and PostgreSQL RLS are supposed to gate,
# so reaching one of them directly bypasses the entire authorization model.
# Override SECURGRAPH_BIND_ADDR only for a deliberately firewalled host.
#
# Credentials use `${VAR:?message}` rather than `${VAR:-default}`: a missing
# value must stop compose, not silently fall back to a known-public default
# that ends up in a deployment. `cp .env.example .env` supplies dev values.
#
# `restart: "no"` everywhere, deliberately. With `unless-stopped` the stack
# came back on every boot and stayed up unnoticed for months, which turns any
# port-binding mistake into a permanent exposure rather than a window while
# you are actually working. These services start with `make up` and stay down
# otherwise. A long-lived deployment sets its own policy at that layer.

name: securgraph

services:

  # ===========================================================================
  # PostgreSQL — metadata, provenance, audit
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: securgraph-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-securgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-securgraph}
    ports:
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init/init-openfga.sql:/docker-entrypoint-initdb.d/init-openfga.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-securgraph} -d ${POSTGRES_DB:-securgraph}"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "no"

  # ===========================================================================
  # Qdrant — vector store
  # ===========================================================================
  qdrant:
    image: qdrant/qdrant:v1.18.0
    container_name: securgraph-qdrant
    ports:
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:6333:6333"   # HTTP / dashboard
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__LOG_LEVEL: INFO
      QDRANT__SERVICE__GRPC_PORT: 6334
      # Chunk payloads live here in cleartext. Without a key, anyone reaching
      # the port reads every tenant's evidence without an OpenFGA check.
      QDRANT__SERVICE__API_KEY: ${SECURGRAPH_QDRANT_API_KEY:?set SECURGRAPH_QDRANT_API_KEY in .env}
    healthcheck:
      # Qdrant image has no wget/curl; use bash TCP to probe the HTTP port.
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1G
    restart: "no"

  # ===========================================================================
  # Neo4j — graph store (community edition).
  # Heap + page cache tuned for minimal hardware.
  #
  # No plugins: Louvain runs in networkx (adapters/community_generator.py) and
  # the writer is deliberately APOC-free (adapters/neo4j_writer.py:158). Both
  # plugins were previously loaded with `procedures_unrestricted: gds.*,apoc.*`,
  # which hands any Cypher foothold `apoc.load.*` — outbound HTTP/JDBC/file
  # reads from inside the database. Unused capability, so it is gone.
  # ===========================================================================
  neo4j:
    image: neo4j:5.25-community
    container_name: securgraph-neo4j
    environment:
      NEO4J_AUTH: ${SECURGRAPH_NEO4J_USER:-neo4j}/${SECURGRAPH_NEO4J_PASSWORD:?set SECURGRAPH_NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_db_tx__log_rotation_retention__policy: "100M size"
    ports:
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:7474:7474"   # HTTP / browser
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1500M
    restart: "no"

  # ===========================================================================
  # OpenFGA — authorization (ReBAC). This is the ground truth for contribution
  # C1: an unauthenticated OpenFGA API lets any caller write their own
  # authorization tuples, and the audit ledger still records the resulting
  # access as authorized. Preshared-key auth is mandatory, and the playground
  # (which requires authn=none) stays off.
  # Migrate-then-run pattern: migrate runs once and exits.
  # ===========================================================================
  openfga-migrate:
    image: openfga/openfga:v1.8.0
    container_name: securgraph-openfga-migrate
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-securgraph}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-securgraph}?sslmode=disable&search_path=openfga
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  openfga:
    image: openfga/openfga:v1.8.0
    container_name: securgraph-openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://${POSTGRES_USER:-securgraph}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-securgraph}?sslmode=disable&search_path=openfga
      OPENFGA_PLAYGROUND_ENABLED: "false"
      OPENFGA_AUTHN_METHOD: preshared
      OPENFGA_AUTHN_PRESHARED_KEYS: ${SECURGRAPH_OPENFGA_API_TOKEN:?set SECURGRAPH_OPENFGA_API_TOKEN in .env}
      OPENFGA_LOG_LEVEL: info
    ports:
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:8080:8080"   # HTTP API
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:8081:8081"   # gRPC
    depends_on:
      postgres:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          memory: 256M
    restart: "no"

  # ===========================================================================
  # Jaeger (all-in-one) — OTel traces UI
  # ===========================================================================
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: securgraph-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:16686:16686"   # UI
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:4317:4317"     # OTLP gRPC
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:4318:4318"     # OTLP HTTP
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:16686 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "no"

  # ===========================================================================
  # Redis — added in M6 for Arq workers, decision cache, LangGraph checkpointer.
  # Profile-gated: enable with `--profile workers`.
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: securgraph-redis
    profiles: ["workers"]
    # The ingest queue carries tenant document payloads; no anonymous access.
    command: ["redis-server", "--requirepass", "${SECURGRAPH_REDIS_PASSWORD:?set SECURGRAPH_REDIS_PASSWORD in .env}"]
    ports:
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SECURGRAPH_REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256M
    restart: "no"

  # ===========================================================================
  # MinIO — S3-compatible Object Lock anchor storage for audit Merkle roots.
  # Profile-gated: enable with `--profile anchor`.
  # Production uses a separate self-hosted MinIO Object Lock deployment.
  # ===========================================================================
  minio:
    image: minio/minio:latest
    container_name: securgraph-minio
    profiles: ["anchor"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:9000:9000"   # S3 API
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
    restart: "no"

  # One-shot bucket provisioning with Object Lock enabled.
  minio-init:
    image: minio/mc:latest
    container_name: securgraph-minio-init
    profiles: ["anchor"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:?} ${MINIO_ROOT_PASSWORD:?} &&
      mc mb --ignore-existing --with-lock local/securgraph-audit-anchors &&
      echo 'MinIO anchor bucket ready with Object Lock enabled'
      "
    restart: "no"

  # ===========================================================================
  # Ollama (container variant) — disabled by default on macOS.
  # Enable with `--profile ollama-container` to run inside Docker (no GPU).
  # ===========================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: securgraph-ollama
    profiles: ["ollama-container"]
    ports:
      - "${SECURGRAPH_BIND_ADDR:-127.0.0.1}:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4G
    restart: "no"

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  ollama_data:
  minio_data:

networks:
  default:
    name: securgraph

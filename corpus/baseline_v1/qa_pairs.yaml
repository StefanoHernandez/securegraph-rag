# ------------------------------------------------------------------ summary

- id: q25
  question: "Summarise the responsibilities and qualifications of the Data Steward as they appear across Helios internal policy and EU Directive 2025/41 Article 14."
  ground_truth: "The Data Steward is the named single-person owner of a dataset for access-control, retention, and incident-reporting purposes. Under Helios policy they must be a permanent employee at grade L4 or above with the Data Stewardship Accreditation; under Article 14 they must hold seniority appropriate to the dataset's sensitivity. They approve access requests, sign the quarterly attestation, review the access list at least quarterly, and must report suspected unauthorised access to the supervisory authority within 72 hours. Their accountability cannot be delegated to a processor."
  expected_context: "The role of Data Steward is the named owner of a dataset [...] Each Data Steward must be a permanent employee at grade L4 or above [...] The Data Steward bears personal responsibility for the following: approving access requests; reviewing the access list at least once per calendar quarter; reporting suspected unauthorised access to the supervisory authority within seventy-two hours; and signing the annual attestation of compliance. [...] The Data Steward remains accountable for compliance and may not delegate that accountability."
  source_documents: ["01_internal_policy.txt", "05_regulation_excerpt.txt"]
  query_type: "summary"

- id: q26
  question: "Summarise the open operational risks and outstanding actions for Project Orion-7 as recorded in the 12 May weekly review."
  ground_truth: "Capacity is at 62% of allocated storage with a forecast of 80% by end of Q3, triggering an action to scope a capacity upgrade. A Severity-2 GraphVault latency incident on 8 May was caused by concurrent community-recompute and index-rebuild jobs and led to a schedule change plus follow-up assigned to Sara Klein. The vendor-concentration risk on Polaris Systems for both hosting and ingestion remains on the register pending a contingency plan. The key-rotation drill is rescheduled to the week of 19 May."
  expected_context: "Polaris Systems reported a Severity-2 incident affecting GraphVault between 03:14 and 03:47 UTC on 8 May [...] GraphVault is currently at 62% of allocated storage [...] keep the risk \"Vendor concentration on Polaris Systems for both GraphVault hosting and ingestion connectors\" on the register [...] Outstanding action AC-31 (key rotation drill) is rescheduled to the week of 19 May."
  source_documents: ["04_meeting_minutes.txt"]
  query_type: "summary"

- id: q27
  question: "Summarise why GraphVault falls under the highest security tier, citing both the security manual and the project that drives the classification."
  ground_truth: "GraphVault is the canonical home for entity-relationship data extracted from customer documents and holds Restricted records, the highest classification tier. Restricted is defined as material that would cause regulatory, contractual, or reputational harm if disclosed; examples explicitly include the onboarding records covered by Project Orion-7. Restricted data triggers AES-256-GCM at rest, TLS 1.3 in transit, key rotation at most every 90 days, immutable audit logging retained seven years, and a one-hour incident reporting window."
  expected_context: "Restricted is the highest tier [...] Examples of Restricted data include onboarding records covered by Project Orion-7 [...] The primary system covered by this section is GraphVault [...] Restricted records are encrypted at rest using AES-256-GCM and in transit using TLS 1.3. [...] Audit entries are retained for seven years."
  source_documents: ["01_internal_policy.txt", "03_security_manual.txt"]
  query_type: "summary"

- id: q28
  question: "Summarise the contractual obligations Polaris Systems has regarding cross-border data movement and personnel clearance under the Orion-7 annex."
  ground_truth: "Polaris Systems may not move Orion-7 data outside the European Economic Area without prior written consent of the Customer's Data Protection Officer. The Provider must maintain at least two engineers cleared at the equivalent of the Customer's Tier-2 Privacy Training at all times, with the list of cleared personnel kept in Appendix B-2 and updated quarterly."
  expected_context: "Polaris Systems shall not move Orion-7 data outside the European Economic Area without prior written consent of the Customer's Data Protection Officer. [...] Polaris Systems shall maintain at least two engineers cleared at the equivalent of Customer's Tier-2 Privacy Training at all times. Cleared personnel shall be listed in Appendix B-2 and updated quarterly."
  source_documents: ["02_service_contract.txt"]
  query_type: "summary"

- id: q29
  question: "Summarise the consequences and process for downgrading or misclassifying a Restricted dataset under Article 14."
  ground_truth: "A Restricted classification may be downgraded only by a documented decision of the Data Steward, countersigned by the Data Protection Officer; the decision must include the rationale and the residual risk assessment and is subject to supervisory-authority review. Failing to designate a Data Steward, or failing to perform the duties of the role, is a serious infringement subject to the Chapter VIII penalties."
  expected_context: "A Restricted classification may be downgraded to a lower tier only by a documented decision of the Data Steward, countersigned by the Data Protection Officer. [...] Failure to designate a Data Steward, or failure of the Data Steward to perform the duties listed in Paragraph 2, constitutes a serious infringement and is subject to the penalties set out in Chapter VIII."
  source_documents: ["05_regulation_excerpt.txt"]
  query_type: "summary"

- id: q30
  question: "Summarise how membership in the \"orion7-engineering\" identity-provider group connects to access control over Orion-7 Restricted records."
  ground_truth: "Members of the Orion-7 team belong to the orion7-engineering group in the corporate identity provider, with membership reviewed quarterly by the Data Steward (Anya Volkov) and revoked within five working days of role change or departure. Read access to Restricted records in GraphVault then additionally requires the requester to be named in the record's policy tag, to have completed Tier-2 Privacy Training, and to have an explicit grant by the record's Data Steward — all recorded in the identity provider and auditable."
  expected_context: "Members of the Orion-7 team belong to the \"orion7-engineering\" group in the corporate identity provider. Group membership is reviewed every quarter by Anya and revoked within five working days of role change or departure. [...] Read access to Restricted records in GraphVault requires (a) membership in a security group named in the record's policy tag, (b) completion of the Tier-2 Privacy Training, and (c) an explicit grant by the record's Data Steward."
  source_documents: ["01_internal_policy.txt", "03_security_manual.txt"]
  query_type: "summary"


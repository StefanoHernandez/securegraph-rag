[project]
name = "securgraph"
version = "0.1.0a0"
description = "Trustworthy hybrid vector-graph RAG with verifiable access control and cross-retriever consensus."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Meridian Labs Foundation", email = "service@meridianlabs.org" },
]
keywords = [
    "rag",
    "retrieval-augmented-generation",
    "graph-rag",
    "access-control",
    "openfga",
    "neo4j",
    "qdrant",
    "langgraph",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]

dependencies = [
    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.7",
    "pydantic-settings>=2.5",
    "httpx>=0.27",

    # Persistence
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",

    # Vector + Graph
    "qdrant-client>=1.12",
    "neo4j>=5.25",
    "neo4j-graphrag>=1.5",

    # Authorization
    "openfga-sdk>=0.8",

    # LLM + embeddings
    "ollama>=0.4",
    "FlagEmbedding>=1.3",

    # Orchestration
    "langgraph>=0.2.40",
    "langchain-core>=0.3",

    # Observability
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-asyncpg>=0.48b0",
    "prometheus-client>=0.21",

    # Logging
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML",
]
eval = [
    "ragas>=0.2",
    "datasets>=3.0",
    "matplotlib>=3.9",
    "pandas>=2.2",
]
parsers = [
    "pypdf>=5.0",
    "python-docx>=1.1",
    "langdetect>=1.0.9",
]
# Loaded from M5+
fusion = [
    "sentence-transformers>=3.2",
]
# Loaded from M6+
async_workers = [
    "arq>=0.26",
    "redis>=5.1",
]
community = [
    "graspologic>=3.4",
    "networkx>=3.3",
]
verifier_alt = [
    "transformers>=4.45",
    "torch>=2.4",
]
load_test = [
    "locust>=2.31",
]

[project.urls]
Homepage = "https://github.com/meridianlabs/securgraph"
Repository = "https://github.com/meridianlabs/securgraph"
Documentation = "https://github.com/meridianlabs/securgraph/tree/main/docs"

[project.scripts]
securgraph = "securgraph.cli:main"

# ----------------------------------------------------------------------------
# Build
# ----------------------------------------------------------------------------
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/securgraph"]

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "ASYNC",
    "S",    # bandit
]
ignore = [
    "S101", # asserts ok in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106"]
"scripts/**/*.py" = ["S101"]

# ----------------------------------------------------------------------------
# mypy
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
strict = false  # graduated strictness; domain/ is strict (override below)
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["securgraph.domain.*"]
strict = true

# ----------------------------------------------------------------------------
# pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--showlocals",
]
markers = [
    "unit: fast unit tests, no external deps",
    "integration: requires running backends (docker compose up)",
    "adversarial: security property tests (Hypothesis)",
    "slow: long-running tests",
]

# ----------------------------------------------------------------------------
# Coverage
# ----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src/securgraph"]
branch = true

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
